name: Publish stable release

on:
  push:
    branches: [ master ]
    paths:
      - 'RELEASE_VERSION'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag (for example 2.3.7)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve and validate release version
        id: version
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_VERSION:-}" ]]; then
            VERSION="$MANUAL_VERSION"
          else
            VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          fi
          [[ -n "$VERSION" ]] || { echo "Empty release version" >&2; exit 1; }

          UPSTREAM_VERSION="$(curl -LfsS https://api.github.com/repos/acidanthera/VoodooPS2/releases/latest | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"

          if [[ "$VERSION" != "$UPSTREAM_VERSION" && "$VERSION" != "$UPSTREAM_VERSION"-focaltech.* ]]; then
            echo "Release $VERSION does not match current Acidanthera release line $UPSTREAM_VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Build ready-to-use Release package
        env:
          BUILD_CONFIGURATION: Release
          BUILD_OUTPUT: ${{ runner.temp }}/FocalTech-Release
        run: |
          set -o pipefail
          chmod +x build_focaltech.sh
          ./build_focaltech.sh 2>&1 | tee build-release.log

      - name: Build developer Debug package
        env:
          BUILD_CONFIGURATION: Debug
          BUILD_OUTPUT: ${{ runner.temp }}/FocalTech-Debug
        run: |
          set -o pipefail
          ./build_focaltech.sh 2>&1 | tee build-debug.log

      - name: Assemble Release and Debug archives
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_OUT="$RUNNER_TEMP/FocalTech-Release"
          DEBUG_OUT="$RUNNER_TEMP/FocalTech-Debug"

          RELEASE_STAGE="$RUNNER_TEMP/VoodooPS2-FocalTech-$VERSION-RELEASE"
          DEBUG_STAGE="$RUNNER_TEMP/VoodooPS2-FocalTech-$VERSION-DEBUG"
          RELEASE_ARCHIVE="$RUNNER_TEMP/VoodooPS2-FocalTech-$VERSION-RELEASE.zip"
          DEBUG_ARCHIVE="$RUNNER_TEMP/VoodooPS2-FocalTech-$VERSION-DEBUG.zip"

          rm -rf "$RELEASE_STAGE" "$DEBUG_STAGE" "$RELEASE_ARCHIVE" "$DEBUG_ARCHIVE"
          mkdir -p "$RELEASE_STAGE" "$DEBUG_STAGE"

          for stage in "$RELEASE_STAGE" "$DEBUG_STAGE"; do
            cp CREDITS.md "$stage/"
            cp LICENSE.md "$stage/"
          done

          cp -R "$RELEASE_OUT/Kexts" "$RELEASE_STAGE/"
          cp "$RELEASE_OUT/INSTALL.txt" "$RELEASE_STAGE/"
          cp "$RELEASE_OUT/SUPPORTED-HARDWARE.md" "$RELEASE_STAGE/"
          cp "$RELEASE_OUT/SOURCE-COMMIT.txt" "$RELEASE_STAGE/"
          cp "$RELEASE_OUT/VOODOOINPUT-VERSION.txt" "$RELEASE_STAGE/"
          cp "$RELEASE_OUT/BUILD-CONFIGURATION.txt" "$RELEASE_STAGE/"

          cp -R "$DEBUG_OUT/Kexts" "$DEBUG_STAGE/"
          [[ ! -d "$DEBUG_OUT/Symbols" ]] || cp -R "$DEBUG_OUT/Symbols" "$DEBUG_STAGE/"
          cp "$DEBUG_OUT/INSTALL.txt" "$DEBUG_STAGE/"
          cp "$DEBUG_OUT/SUPPORTED-HARDWARE.md" "$DEBUG_STAGE/"
          cp "$DEBUG_OUT/SOURCE-COMMIT.txt" "$DEBUG_STAGE/"
          cp "$DEBUG_OUT/VOODOOINPUT-VERSION.txt" "$DEBUG_STAGE/"
          cp "$DEBUG_OUT/BUILD-CONFIGURATION.txt" "$DEBUG_STAGE/"

          ditto -c -k --sequesterRsrc --keepParent "$RELEASE_STAGE" "$RELEASE_ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent "$DEBUG_STAGE" "$DEBUG_ARCHIVE"
          shasum -a 256 "$RELEASE_ARCHIVE" > "$RELEASE_ARCHIVE.sha256"
          shasum -a 256 "$DEBUG_ARCHIVE" > "$DEBUG_ARCHIVE.sha256"

          echo "release_archive=$RELEASE_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "release_checksum=$RELEASE_ARCHIVE.sha256" >> "$GITHUB_OUTPUT"
          echo "debug_archive=$DEBUG_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "debug_checksum=$DEBUG_ARCHIVE.sha256" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## VoodooPS2-FocalTech $VERSION

          Stable FocalTech release following the **Acidanthera VoodooPS2 $UPSTREAM_VERSION release line**.

          ### Downloads
          - **\`VoodooPS2-FocalTech-$VERSION-RELEASE.zip\` — recommended for normal users.** This is a precompiled, ready-to-use package; Xcode and source compilation are not required.
          - **\`VoodooPS2-FocalTech-$VERSION-DEBUG.zip\` — for developers, diagnostics and hardware bring-up.** It is not recommended for normal daily use when the Release package works correctly. Debug symbols are included when produced by the build.

          Both packages contain installation instructions, hardware limitations, credits, source commit metadata and the pinned VoodooInput version.

          ### Hardware scope and limitations
          This fork targets **FocalTech PS/2 trackpads**. It is not intended as a replacement for the normal VoodooPS2 support for Synaptics, ELAN/Elantech, ALPS, Sentelic or generic PS/2 mouse/trackpad hardware.

          - **FLT0101** — hardware validated; mux-safe i8042 path; **do not use** \`foclegacy=1\`.
          - **FLT0102** — hardware validated; simple AUX compatibility path; **use** \`foclegacy=1\`.
          - **FLT0103** — protocol support is experimental and not yet hardware-validated.
          - Other/unknown FocalTech PS/2 devices may be tried, but are experimental until validated on physical hardware.
          - Validated on **macOS Sequoia** and **macOS Tahoe** on tested FLT0101/FLT0102 hardware.

          ### Confirmed functions
          Cursor movement, native multitouch through VoodooInput, macOS gestures, left/right click, dragging, progressive Force Click / Look Up emulation, sleep/wake reinitialization, and mux-safe probing.

          ### Important for OCA Auxiliary Tools (OCAT) users
          If **OCA Auxiliary Tools (OCAT)** reports an update for \`VoodooPS2Controller.kext\` on a machine using this fork, **do not let OCAT replace this fork's VoodooPS2 stack with the stock Acidanthera build** unless you intentionally want to remove FocalTech support.

          This fork uses a patched controller and a separate FocalTech client. The patched controller can have a **different file size and hash/MD5 from Acidanthera's stock binary even when the displayed version number is the same**. OCAT may therefore show the stock package as an available update. **That difference is expected and is not an error.** Replacing this fork can remove the FocalTech compatibility path and stop the trackpad.

          Update this FocalTech stack from this repository's Releases page.

          ### Versioning note
          The public release number follows Acidanthera's VoodooPS2 release line. This fork is **not byte-for-byte identical** to the upstream binary because it includes the FocalTech-specific controller and trackpad changes documented in this repository.

          ### Credits
          Acidanthera and VoodooPS2 contributors; Apple and historical Apple PS/2 contributors; VoodooInput/VoodooI2C contributors; **EMlyDinEsH / ApplePS2SmartTouchPad**; Linux kernel FocalTech/input contributors; earlier VoodooPS2/ApplePS2/RehabMan-era contributors; and StefanAlMare for the modern FocalTech integration in this fork. See \`CREDITS.md\` in the repository/package for full attribution.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.release_archive }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.release_checksum }}
          DEBUG_ARCHIVE: ${{ steps.package.outputs.debug_archive }}
          DEBUG_CHECKSUM: ${{ steps.package.outputs.debug_checksum }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "VoodooPS2-FocalTech $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RELEASE_ARCHIVE" \
            "$RELEASE_CHECKSUM" \
            "$DEBUG_ARCHIVE" \
            "$DEBUG_CHECKSUM"

      - name: Upload release build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooPS2-FocalTech-${{ steps.version.outputs.version }}-build-logs
          path: |
            build-release.log
            build-debug.log
          if-no-files-found: ignore

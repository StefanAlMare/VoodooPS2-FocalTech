name: FocalTech build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Check controller compatibility patch
        run: python3 -m unittest discover -s Tests -v

      - name: Build FocalTech ${{ matrix.configuration }} package
        shell: bash
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
          BUILD_OUTPUT: ${{ runner.temp }}/VoodooPS2-FocalTech-${{ matrix.configuration }}
        run: |
          set -o pipefail
          ./build_focaltech.sh 2>&1 | tee "$RUNNER_TEMP/build-${{ matrix.configuration }}.log"

      - name: Upload package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooPS2-FocalTech-${{ matrix.configuration }}
          path: ${{ runner.temp }}/VoodooPS2-FocalTech-${{ matrix.configuration }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooPS2-FocalTech-${{ matrix.configuration }}-build-log
          path: ${{ runner.temp }}/build-${{ matrix.configuration }}.log
          if-no-files-found: warn

name: FocalTech build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'FocalTech/**'
      - 'Scripts/**'
      - 'build_focaltech.sh'
      - '.github/workflows/focaltech.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build FocalTech package
        shell: bash
        run: |
          set -o pipefail
          ./build_focaltech.sh 2>&1 | tee build.log

      - name: Collect artifact
        if: success()
        run: |
          mkdir -p artifacts
          cp -R "$HOME/Desktop/VoodooPS2-FocalTech-Build/Kexts" artifacts/
          cp "$HOME/Desktop/VoodooPS2-FocalTech-Build/INSTALL.txt" artifacts/

      - name: Upload kext package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooPS2-FocalTech
          path: artifacts

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooPS2-FocalTech-build-log
          path: build.log
          if-no-files-found: warn

name: FocalTech build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'FocalTech/**'
      - 'Scripts/**'
      - 'build_focaltech.sh'
      - '.github/workflows/focaltech.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build FocalTech package
        run: ./build_focaltech.sh

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp -R "$HOME/Desktop/VoodooPS2-FocalTech-Build/Kexts" artifacts/
          cp "$HOME/Desktop/VoodooPS2-FocalTech-Build/INSTALL.txt" artifacts/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VoodooPS2-FocalTech
          path: artifacts

name: Refresh 2.3.7 documentation fix

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/refresh-237.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build corrected package
        run: |
          set -o pipefail
          chmod +x build_focaltech.sh
          ./build_focaltech.sh 2>&1 | tee build.log

      - name: Assemble corrected release archive
        run: |
          set -euo pipefail
          VERSION=2.3.7
          OUT="$HOME/Desktop/VoodooPS2-FocalTech-Build"
          STAGE="$RUNNER_TEMP/VoodooPS2-FocalTech-$VERSION"
          ARCHIVE="$RUNNER_TEMP/VoodooPS2-FocalTech-$VERSION-RELEASE.zip"
          rm -rf "$STAGE" "$ARCHIVE"
          mkdir -p "$STAGE"
          cp -R "$OUT/Kexts" "$STAGE/"
          cp "$OUT/INSTALL.txt" "$STAGE/"
          cp "$OUT/SOURCE-COMMIT.txt" "$STAGE/"
          cp "$OUT/VOODOOINPUT-VERSION.txt" "$STAGE/"
          cp CREDITS.md "$STAGE/"
          cp LICENSE.md "$STAGE/"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Write corrected release notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## VoodooPS2-FocalTech 2.3.7

          Stable FocalTech release following the **Acidanthera VoodooPS2 2.3.7 release line**.

          ### Hardware and macOS validation
          - **FLT0101** — hardware validated; mux-safe i8042 path; **do not use** `foclegacy=1`.
          - **FLT0102** — hardware validated; simple AUX compatibility path; **use** `foclegacy=1`.
          - **FLT0103** — protocol support is experimental and not yet hardware-validated.
          - Validated on **macOS Sequoia** and **macOS Tahoe** on tested FLT0101/FLT0102 hardware.

          ### Confirmed functions
          Cursor movement, native multitouch through VoodooInput, macOS gestures, left/right click, dragging, progressive Force Click / Look Up emulation, sleep/wake reinitialization, and mux-safe probing.

          ### Important for OCA Auxiliary Tools (OCAT) users
          If **OCA Auxiliary Tools (OCAT)** reports an update for `VoodooPS2Controller.kext` on a machine using this fork, **do not let OCAT replace this fork's VoodooPS2 stack with the stock Acidanthera build** unless you intentionally want to remove FocalTech support.

          This fork uses a patched `VoodooPS2Controller.kext` and a separate `VoodooPS2FocalTech.kext`. Because the controller binary is modified, its **file size and hash/MD5 can differ from Acidanthera's stock VoodooPS2 binary even when the displayed version number is the same**. OCAT may therefore mark the stock package as an available update. **That difference is expected and is not an error.**

          Replacing this fork with the stock Acidanthera VoodooPS2 package can remove the FocalTech controller compatibility path and stop the trackpad. Update this stack from this repository's Releases page instead.

          ### Versioning note
          The public release number follows Acidanthera's VoodooPS2 release line. This fork is **not byte-for-byte identical** to the upstream binary because it includes the FocalTech-specific controller and trackpad changes documented in this repository.

          ### Credits
          Acidanthera and VoodooPS2 contributors; Apple and historical Apple PS/2 contributors; VoodooInput/VoodooI2C contributors; **EMlyDinEsH / ApplePS2SmartTouchPad**; Linux kernel FocalTech/input contributors; earlier VoodooPS2/ApplePS2/RehabMan-era contributors; and StefanAlMare for the modern FocalTech integration in this fork. See `CREDITS.md` in the repository/package for full attribution.
          EOF

      - name: Replace 2.3.7 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete 2.3.7 --cleanup-tag --yes
          gh release create 2.3.7 \
            --target "$GITHUB_SHA" \
            --title "VoodooPS2-FocalTech 2.3.7" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/VoodooPS2-FocalTech-2.3.7-RELEASE.zip" \
            "$RUNNER_TEMP/VoodooPS2-FocalTech-2.3.7-RELEASE.zip.sha256"
